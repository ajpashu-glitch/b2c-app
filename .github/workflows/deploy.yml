name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sharp-franklin-twhq90]
  workflow_dispatch:

# Allow one concurrent deployment, and let a run finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves the site from https://<owner>.github.io/<repo>/,
      # so assets and the router basename need that prefix.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # enablement turns Pages on via the API (needs the pages: write scope
      # above), so a fresh repo deploys without anyone opening Settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
